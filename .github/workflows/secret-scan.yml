# Refuses a push or pull request that carries a credential. Public repo: Actions minutes are free, so it runs on
# every push. The scanner is scripts/scan-secrets.sh; it names the file and line of a hit, never the text.
name: secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a tag can be moved. The token is not left in the checkout: nothing after it needs GitHub.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: the tree, and every commit since the base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=${PR_BASE:-$BEFORE}
          # A new branch's "before" is all zeros, and a force-push's may be a commit that is gone. The tree alone
          # would pass a key added and removed inside the push, so read back to where the branch left main, and
          # failing that the whole history.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base HEAD origin/main 2>/dev/null || true)
            [ "$base" != "$(git rev-parse HEAD)" ] || base=
          fi
          # The scanner is main's, not this push's or pull request's own: a change that edits the scanner to find
          # nothing is still read by the one on main. (The workflow file itself is the pushed commit's, which GitHub
          # decides; Jupiter's check compares it with the original on main and dev.)
          # On a push to main itself, origin/main is already the pushed commit, so the scanner is read from where main
          # stood before the push. A first push of main, or a main that had no scanner yet, has nothing older to read.
          src=origin/main
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && git cat-file -e "$BEFORE:scripts/scan-secrets.sh" 2>/dev/null; then src=$BEFORE; fi
          git show "$src:scripts/scan-secrets.sh" > "$RUNNER_TEMP/scan-secrets.sh" \
            || { echo "main has no scripts/scan-secrets.sh: nothing was scanned"; exit 2; }
          if [ -n "$base" ]; then bash "$RUNNER_TEMP/scan-secrets.sh" "$base"; else bash "$RUNNER_TEMP/scan-secrets.sh" --history; fi
